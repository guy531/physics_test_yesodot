<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --ink: #1f2328; --muted: #5f6670; --line: #dcdad4;
    --accent: #1f5fa8; --accent-soft: #e6eef8; --good: #1d7a46; --good-soft: #e3f3ea;
    --bad: #b3261e; --bad-soft: #fbe7e5; --warn-soft: #f3efe2;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: 'Assistant', 'Segoe UI', Arial, sans-serif; font-size: 19px; line-height: 1.6; }
  .wrap { max-width: 780px; margin: 0 auto; padding: 16px 16px 48px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px 22px 18px; }
  h1 { font-size: 1.45rem; margin: 0 0 12px; line-height: 1.3; }
  h2 { font-size: 1.15rem; margin: 22px 0 8px; }
  p { margin: 0 0 12px; }
  ul { margin: 0 0 12px; padding-inline-start: 22px; }
  li { margin-bottom: 6px; }
  .katex { direction: ltr; unicode-bidi: isolate; font-size: 1.05em; white-space: nowrap; }   /* never break a formula across lines */
  .katex-display { margin: 10px 0; overflow-x: auto; overflow-y: hidden; }
  .cambria math { font-family: 'Cambria Math', serif; font-size: 1.12em; }
  .cambria .katex { line-height: normal; }
  .cambria math[display="block"] { font-size: 1.25em; margin: 0.45em 0; padding: 0.2em 0; }
  .cambria .opt math[display="block"] { margin: 0; }
  .cambria .katex-display math { font-size: 1.2em; }
  .logo { text-align: right; margin: 0 0 18px; padding-bottom: 8px; border-bottom: 1px solid #253677; }   /* blue line under the logo, as in the PDF summary */
  .qtop { flex-wrap: nowrap; }
  .qtop .meta { flex: 1 1 0; min-width: 0; }
  .qtop .tools { flex: 1 1 0; justify-content: flex-end; flex-wrap: nowrap; white-space: nowrap; }
  @media (max-width: 560px) { .qtop { flex-wrap: wrap; } .qtop .meta { flex: 1 1 100%; } .qtop .tools { flex: none; } }
  .logo img { display: block; width: 144px; max-width: 70%; height: auto; }
  .fig { text-align: center; margin: 12px 0; }
  .fig img { max-width: 100%; height: auto; }
  .btn { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink);
         border-radius: 10px; padding: 9px 18px; cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  .btn.primary:disabled { background: #9db5d3; border-color: #9db5d3; cursor: default; }
  .btn.ghost { background: transparent; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; }
  a.btn { text-decoration: none; display: inline-block; }
  .pdf { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; color: var(--muted); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
  .meta { color: var(--muted); font-size: .95rem; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 16px; }
  .bar > div { height: 100%; background: var(--accent); transition: width .2s; }
  .qnum { font-weight: 700; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0 10px; }
  .opts.long { grid-template-columns: 1fr; }
  .opt { display: flex; align-items: flex-start; gap: 10px; text-align: right; font: inherit; color: inherit;
         background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 14px;
         cursor: pointer; min-height: 52px; }
  .opt.center { align-items: center; }
  .opt:hover { border-color: var(--accent); }
  .opt.sel { border-color: var(--accent); background: var(--accent-soft); }
  .opt .let { font-weight: 700; min-width: 1.4em; }
  .opt .txt { flex: 1; min-width: 0; }
  .opt .katex-display { margin: 0; }
  .dunno { width: 100%; justify-content: center; color: var(--muted); }
  .nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; }
  .modal { position: fixed; inset: 0; background: rgba(20,20,20,.45); display: none; align-items: flex-start;
           justify-content: center; padding: 24px 12px; overflow-y: auto; z-index: 10; }
  /* formula-sheet button: highlighted while the sheet is open; a second click closes it */
  body.fopen .fbtn { background: var(--accent); border-color: var(--accent); color: #fff; }   /* same size, so nothing moves */
  .fbtn.inpanel { padding: 6px 14px; font-size: 1.05rem; line-height: 1.4; }   /* close button inside the sheet (phones) */
  @media (min-width: 1100px) { .fbtn.inpanel { display: none; } }
  .modal.open { display: flex; }
  /* formula sheet: compact grid, fits one screen */
  #fmodal { padding: 12px; align-items: center; }
  #fmodal .card { max-width: 900px; padding: 14px 18px; }
  #fmodal .top { margin-bottom: 6px; }
  .fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .fcell { border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; }
  .fcell.wide { grid-column: 1 / -1; }
  .fcell p { margin: 0 0 2px; }
  .fcell .katex-display { margin: 0.2em 0; }
  .cambria .fcell math[display="block"] { margin: 0.1em 0; padding: 0.1em 0; font-size: 1.15em; }
  @media (max-width: 560px) { .fgrid { grid-template-columns: 1fr; gap: 6px; } #fmodal .card { padding: 10px 12px; } }
  /* wide screens: the formula sheet is a side panel on the right, next to the question (no overlay) */
  @media (min-width: 1100px) {
    #fmodal { inset: 0 0 0 auto; width: var(--pw); padding: 0; background: transparent; align-items: stretch; overflow: hidden; }
    #fmodal .card { max-width: none; height: 100vh; overflow-y: auto; border-radius: 0; border-width: 0 0 0 1px;
                    box-shadow: -4px 0 18px rgba(0,0,0,.08); padding: 14px 16px; }
    #fmodal .fgrid { grid-template-columns: 1fr; gap: 5px; }
    #fmodal .fcell { padding: 3px 10px; }
    .cambria #fmodal .fcell math[display="block"] { font-size: 1.08em; margin: 0; padding: 0.05em 0; }
    #fmodal .fcell .katex-display { margin: 0.05em 0; }
    /* the question never moves; the panel sits on top of the right margin */
    :root { --pw: clamp(330px, calc(50vw - 400px), 430px); }
  }
  .modal .card { max-width: 640px; width: 100%; }
  .scores { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 14px 0; }
  .score { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .score .big { font-size: 1.7rem; font-weight: 700; }
  .score.ok { background: var(--good-soft); border-color: #b9dcc7; }
  .score.low { background: var(--bad-soft); border-color: #efc3bf; }
  .rec { background: var(--warn-soft); border-radius: 12px; padding: 12px 16px; margin: 6px 0 4px; }
  .rev { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; }
  .tag { display: inline-block; font-size: .85rem; font-weight: 700; border-radius: 6px; padding: 1px 8px; margin-inline-start: 8px; }
  .tag.ok { background: var(--good-soft); color: var(--good); }
  .tag.bad { background: var(--bad-soft); color: var(--bad); }
  .tag.dk { background: var(--line); color: var(--muted); }
  .ans { margin: 8px 0; }
  .sol { background: #fafaf8; border-inline-start: 3px solid var(--accent); padding: 8px 12px; margin-top: 8px; border-radius: 6px; }
  .toggle { display: flex; align-items: center; gap: 8px; margin: 10px 0; color: var(--muted); }
  @media (max-width: 600px) {
    body { font-size: 18px; }
    .card { padding: 16px 14px 14px; }
    .opts { grid-template-columns: 1fr; }
    .scores { grid-template-columns: 1fr; }
  }
  /* ---- printable summary (results page > "סיכום התוצאות כ- PDF"): built on demand, shown only when printing */
  #print { display: none; }
  /* off-screen A4 page (794 px wide) that html2canvas photographs for the PDF */
  #print.cap { display: block; position: fixed; top: 0; left: -12000px; width: 794px; padding: 46px 52px; background: #fff;
               font-size: 16px; line-height: 1.4; color: #1d1d1f; }
  @media print {
    @page { size: A4; margin: 13mm 14mm; }
    html, body { background: #fff; }
    body > *:not(#print) { display: none !important; }
    #print { display: block; font-size: 12pt; line-height: 1.4; color: #1d1d1f; }
    #print * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
  .ps-head { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid #253677; padding-bottom: 8px; }
  .ps-head img { height: 28px; }
  .ps-head .ps-date { color: #555; font-size: .9em; text-align: left; }
  .ps-title { font-size: 1.45em; font-weight: 700; margin: 14px 0 2px; color: #253677; }
  .ps-sub { color: #555; margin: 0 0 14px; }
  .ps-scores { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .ps-score { border: 1px solid #d9d9de; border-radius: 10px; padding: 10px 14px; }
  .ps-score .ps-name { font-weight: 600; }
  .ps-score .ps-big { font-size: 1.9em; font-weight: 700; line-height: 1.2; }
  .ps-track { position: relative; height: 8px; background: #e6e6ea; border-radius: 4px; margin: 6px 0 4px; }
  .ps-fill { height: 100%; border-radius: 4px; }
  .ps-mark { position: absolute; top: -4px; width: 2px; height: 16px; background: #1d1d1f; }
  .ps-score .ps-note { color: #555; font-size: .85em; }
  .ps-ok .ps-big { color: #1e7a46; } .ps-ok .ps-fill { background: #3fa46a; }
  .ps-low .ps-big { color: #b3261e; } .ps-low .ps-fill { background: #d9534f; }
  .ps-rec { margin: 14px 0; padding: 10px 14px; border-radius: 10px; background: #eef1f9; border-inline-start: 4px solid #253677; }
  .ps-rec b { color: #253677; }
  .ps-tables { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
  .ps-tables table { width: 100%; border-collapse: collapse; font-size: .9em; }
  .ps-tables caption { font-weight: 700; text-align: right; padding-bottom: 4px; }
  .ps-tables th, .ps-tables td { border: 1px solid #d9d9de; padding: 1px 6px; text-align: center; }
  .ps-tables th { background: #f1f1f4; font-weight: 600; }
  .ps-tables tr.c td { background: #e7f4ec; } .ps-tables tr.w td { background: #fbe9e8; } .ps-tables tr.d td { background: #f4f4f6; }
  .ps-legend { color: #555; font-size: .85em; margin-top: 8px; }
  .ps-foot a { color: #253677; }
  .ps-foot { margin-top: 14px; padding-top: 8px; border-top: 1px solid #d9d9de; color: #555; font-size: .85em; }</style>
</head>
<body>
<div id="print"></div>
<div class="wrap"><div id="app" class="card"></div></div>

<div id="fmodal" class="modal" onclick="if(event.target===this)closeFormula()">
  <div class="card">
    <div class="top"><h1 style="margin:0">דף נוסחאות</h1><button class="btn ghost fbtn inpanel" onclick="toggleFormula()" aria-label="סגירת דף הנוסחאות">&#x2715;</button></div>
    <div id="fbody"></div>
  </div>
</div>

<script>
const LETTERS = ['א', 'ב', 'ג', 'ד'];
const DUNNO = 4;
const NEED = { 1: 10, 2: 11 };   // correct answers needed in part A (math) and part B (physics)
const PARTS = { 1: "חלק א' – מתמטיקה", 2: "חלק ב' – פיסיקה" };
const Q = window.QUIZ.questions;
const STORE = 'placement-quiz-v1';
const app = document.getElementById('app');

let st = load() || fresh();

function fresh() {
  return { screen: 'intro', i: 0, ans: Q.map(() => null), sid: Math.random().toString(36).slice(2, 10),
           t0: null, t1: null, sent: false };
}
function load() {
  try { const s = JSON.parse(localStorage.getItem(STORE)); if (s && s.ans && s.ans.length === Q.length) return s; } catch (e) {}
  return null;
}
function save() { try { localStorage.setItem(STORE, JSON.stringify(st)); } catch (e) {} }

// Formulas are drawn in Cambria Math (the font of the figures) when the computer has it: KaTeX then
// outputs MathML and the browser sets it in that font. Otherwise KaTeX's own fonts are used.
const HAS_CAMBRIA = (() => {
  try {
    const c = document.createElement('canvas').getContext('2d'), s = 'mmmmmmmmmmlli1234567890';
    c.font = '40px monospace'; const w0 = c.measureText(s).width;
    c.font = '40px "Cambria Math", monospace'; return c.measureText(s).width !== w0;
  } catch (e) { return false; }
})();
if (HAS_CAMBRIA && !/[?&]katex/.test(location.search)) document.documentElement.classList.add('cambria');
function math(el) {
  if (window.renderMathInElement) {
    renderMathInElement(el, { delimiters: [{ left: '$$', right: '$$', display: true }, { left: '$', right: '$', display: false }],
                              throwOnError: false, output: document.documentElement.classList.contains('cambria') ? 'mathml' : 'htmlAndMathml' });
  }
}
function blocks(list) {
  return list.map(b => b.t === 'img' ? `<div class="fig"><img src="${b.src}" alt=""></div>`
                     : b.t === 'e' ? `<div>${b.h}</div>` : `<p>${b.h}</p>`).join('');
}
function isLong(q) {
  return q.opts.some(o => !o.d && o.h.replace(/\$[^$]*\$/g, 'xxxx').replace(/<[^>]+>/g, '').length > 30);
}

function render() {
  save();
  if (st.screen === 'intro') return intro();
  if (st.screen === 'q') return question();
  return results();
}

function intro() {
  const nA = Q.filter(q => q.part === 1).length, nB = Q.length - nA;
  app.innerHTML = `
    <div class="logo"><img src="ou-logo.svg" alt="האוניברסיטה הפתוחה"></div>
    <h1>מבחן התאמה – האם כדאי לי להירשם לסדנת ההכנה בפיסיקה?</h1>
    <p>המבחן נועד לעזור לכם להחליט אם כדאי לכם ללמוד את <b>סדנת ההכנה בפיסיקה (91463)</b> לפני הקורס <b>יסודות הפיסיקה א (20113)</b> או הקורס <b>יסודות הפיסיקה (20125)</b>. המבחן אינו משפיע על לימודיכם. כדי שהתוצאה תשקף את הידע שלכם, פתרו אותו לבד, בלי עזרה ובלי לחפש תשובות.</p>
    <h2>הוראות</h2>
    <ul>
      <li>במבחן ${Q.length} שאלות אמריקאיות. לכל שאלה יש תשובה נכונה אחת בלבד.</li>
      <li><b>חלק א'</b> (שאלות 1–${nA}): מתמטיקה. <b>חלק ב'</b> (שאלות ${nA + 1}–${Q.length}): פיסיקה בסיסית.</li>
      <li>מותר להשתמש במחשבון. ודאו שהמחשבון מכוון למעלות (DEG) ולא לרדיאנים (RAD).</li>
      <li>דף נוסחאות זמין בכל שלב, בכפתור "דף נוסחאות".</li>
      <li>זמן מומלץ: כשעה.</li>
      <li>אם אינכם יודעים את התשובה לשאלה, בחרו "לא יודע/ת". אל תנחשו – ניחוש עלול לתת לכם תמונה לא נכונה של הידע שלכם.</li>
      <li>בסוף המבחן תקבלו את הציון בכל חלק, המלצה לאיזה קורס להירשם, והסבר לכל שאלה.</li>
    </ul>
    <p class="pdf">מעדיפים לפתור על דף? אפשר להוריד את המבחן כקובץ PDF:
      <a class="btn ghost" href="placement-test.pdf" target="_blank" rel="noopener">המבחן כקובץ PDF</a></p>
    <div class="nav">
      <span class="tools">
        <button class="btn ghost fbtn" onclick="toggleFormula()">דף נוסחאות</button>
        ${st.ans.some(a => a !== null) ? '<button class="btn ghost" onclick="restart()">להתחיל מחדש</button>' : ''}
      </span>
      <button class="btn primary" onclick="start()">${st.ans.some(a => a !== null) ? 'המשך מהמקום שהפסקתי' : 'התחל'}</button>
    </div>`;
}
function start() {
  if (!st.t0) st.t0 = Date.now();
  const next = st.ans.indexOf(null);              // continue at the first question not answered yet
  if (st.ans.some(x => x !== null)) st.i = next >= 0 ? next : Q.length - 1;
  st.screen = 'q'; render(); window.scrollTo(0, 0);
}

function question() {
  const q = Q[st.i], a = st.ans[st.i], long = isLong(q);
  const opts = q.opts.map((o, k) => `
      <button class="opt${a === k ? ' sel' : ''}${o.d ? ' center' : ''}" onclick="pick(${k})">
        <span class="let">${LETTERS[k]}.</span><span class="txt">${o.h}</span></button>`).join('');
  app.innerHTML = `
    <div class="top qtop">
      <span class="meta">${PARTS[q.part]} · שאלה ${st.i + 1} מתוך ${Q.length}</span>
      <span class="tools">
        <button class="btn ghost fbtn" onclick="toggleFormula()">דף נוסחאות</button>
        <button class="btn ghost" onclick="restart()">להתחיל מחדש</button>
      </span>
    </div>
    <div class="bar"><div style="width:${100 * (st.i + 1) / Q.length}%"></div></div>
    ${blocks(q.pre)}
    <p><span class="qnum">${q.n}.</span> ${q.stem}</p>
    ${blocks(q.body)}
    <div class="opts${long ? ' long' : ''}">${opts}</div>
    <button class="opt dunno${a === DUNNO ? ' sel' : ''}" onclick="pick(${DUNNO})">לא יודע/ת</button>
    <div class="nav">
      <button class="btn" onclick="go(-1)">הקודם</button>
      <button class="btn primary" onclick="go(1)" ${a === null ? 'disabled' : ''}>${st.i === Q.length - 1 ? 'סיום' : 'הבא'}</button>
    </div>`;
  math(app);
}
function pick(k) {
  const first = st.ans[st.i] === null, i = st.i;
  st.ans[i] = k; render();
  // first answer to this question: move on to the next one at once (not on the last question, and not when
  // the student changes an answer they had already given)
  if (first && i < Q.length - 1) go(1);   // no delay
}
function go(d) {
  if (d < 0 && st.i === 0) { st.screen = 'intro'; render(); window.scrollTo(0, 0); return; }   // back to the instructions; answers are kept
  if (d > 0 && st.i === Q.length - 1) { finish(); return; }
  st.i = Math.max(0, Math.min(Q.length - 1, st.i + d)); render(); window.scrollTo(0, 0);
}

function tally() {
  const r = { 1: { c: 0, n: 0 }, 2: { c: 0, n: 0 } };
  Q.forEach((q, i) => { r[q.part].n++; if (st.ans[i] === q.k) r[q.part].c++; });
  for (const p of [1, 2]) { r[p].need = NEED[p]; r[p].ok = r[p].c >= r[p].need; }
  return r;
}
// recommendation: physics decides about the workshop; math only adds "review first"
function recCode(r) { return !r[2].ok ? 'workshop' : (r[1].ok ? 'ready' : 'math'); }
function recText(r) {
  return { ready: 'אפשר להירשם ישירות ליסודות הפיסיקה.',
           math: 'אפשר להירשם ליסודות הפיסיקה, אבל לפני כן מומלץ לחזור על הנושאים המתמטיים שבהם טעיתם.',
           workshop: 'מומלץ להירשם לסדנת ההכנה בפיסיקה.' }[recCode(r)];
}

function finish() {
  st.t1 = Date.now(); st.screen = 'res';
  const r = tally();
  if (!st.sent) { report(r); st.sent = true; }
  render(); window.scrollTo(0, 0);
}
function report(r) {
  const url = (window.QUIZ_CONFIG || {}).collectUrl;
  if (!url) return;
  const body = JSON.stringify({
    sid: st.sid, started: new Date(st.t0).toISOString(), minutes: Math.round((st.t1 - st.t0) / 600) / 100,
    scoreA: r[1].c, nA: r[1].n, scoreB: r[2].c, nB: r[2].n, rec: recCode(r),
    answers: st.ans.map(a => a === DUNNO ? '?' : (a === null ? '-' : LETTERS[a])).join(''),
    key: Q.map(q => LETTERS[q.k]).join('')
  });
  try { fetch(url, { method: 'POST', mode: 'no-cors', keepalive: true, headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body }); } catch (e) {}
}

// printable one-page summary; the browser's print dialog saves it as PDF
function printSummary() {
  const r = tally(), d = new Date(st.t1 || Date.now());
  const date = d.toLocaleDateString('he-IL', { day: 'numeric', month: 'long', year: 'numeric' });
  const score = (p, name) => `<div class="ps-score ${r[p].ok ? 'ps-ok' : 'ps-low'}"><div class="ps-name">${name}</div>
      <div class="ps-big"><bdi dir="ltr">${r[p].c} / ${r[p].n}</bdi></div>
      <div class="ps-track" dir="ltr"><div class="ps-fill" style="width:${100 * r[p].c / r[p].n}%"></div><div class="ps-mark" style="left:${100 * r[p].need / r[p].n}%"></div></div>
      <div class="ps-note">${r[p].ok ? 'עברתם את הסף' : 'מתחת לסף'} – הסף, ${r[p].need} תשובות נכונות, מסומן בקו השחור</div></div>`;
  const table = (p, name) => {
    const rows = Q.map((q, i) => ({ q, a: st.ans[i] })).filter(x => x.q.part === p).map(({ q, a }) => {
      const cls = a === q.k ? 'c' : (a === DUNNO || a === null ? 'd' : 'w');
      const mark = { c: '✓', w: '✗', d: '–' }[cls];
      const yours = a === DUNNO || a === null ? 'לא יודע/ת' : LETTERS[a];
      return `<tr class="${cls}"><td><b>${q.n}</b></td><td>${yours}</td><td>${LETTERS[q.k]}</td><td>${mark}</td></tr>`;
    }).join('');
    return `<table><caption>${name}</caption><tr><th>שאלה</th><th>התשובה שלך</th><th>התשובה הנכונה</th><th></th></tr>${rows}</table>`;
  };
  const url = location.origin + location.pathname;
  document.getElementById('print').innerHTML = `
    <div class="ps-head"><img src="ou-logo.svg" alt="האוניברסיטה הפתוחה"><div class="ps-date">${date}</div></div>
    <div class="ps-title">מבחן התאמה – סדנת הכנה בפיסיקה <bdi dir="ltr">(91463)</bdi></div>
    <p class="ps-sub">סיכום התוצאות</p>
    <div class="ps-scores">${score(1, "חלק א' – מתמטיקה")}${score(2, "חלק ב' – פיסיקה")}</div>
    <div class="ps-rec"><b>ההמלצה:</b> ${recText(r)}</div>
    <div class="ps-tables">${table(1, "חלק א' – מתמטיקה")}${table(2, "חלק ב' – פיסיקה")}</div>
    <div class="ps-legend">✓ תשובה נכונה &nbsp;·&nbsp; ✗ תשובה לא נכונה &nbsp;·&nbsp; – לא יודע/ת, נחשבת כתשובה לא נכונה</div>
    <div class="ps-foot">הסבר מלא לכל שאלה מופיע בעמוד התוצאות באתר המבחן: <a id="ps-link" href="${url}" dir="ltr">${url}</a></div>`;
  // draw the page with html2canvas (the browser's own rendering, so Hebrew stays right) and save it as an A4 PDF
  const btn = document.getElementById('pdfbtn'), label = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'מכין את הקובץ...'; }
  const el = document.getElementById('print'); el.classList.add('cap');
  const done = () => { el.classList.remove('cap'); if (btn) { btn.disabled = false; btn.textContent = label; } };
  loadScripts(['https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
               'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'])
    .then(() => document.fonts ? document.fonts.ready : null)
    .then(() => html2canvas(el, { scale: 4, backgroundColor: '#ffffff', useCORS: true }))
    .then(canvas => {
      const pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });
      const w = 210, h = Math.min(297, w * canvas.height / canvas.width);
      pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, w, h, undefined, 'FAST');
      // clickable link over the site address
      const k = w / el.offsetWidth, box = el.getBoundingClientRect(), a = document.getElementById('ps-link').getBoundingClientRect();
      pdf.link((a.left - box.left) * k, (a.top - box.top) * k, a.width * k, a.height * k, { url: document.getElementById('ps-link').href });
      pdf.save('סיכום מבחן התאמה - סדנת הכנה בפיסיקה.pdf');
      done();
    })
    .catch(() => { done(); alert('לא הצלחנו ליצור את הקובץ. נסו שוב, או השתמשו בהדפסה (Ctrl+P) ובחרו "שמירה כ- PDF".'); });
}
function loadScripts(urls) {
  return urls.reduce((pr, u) => pr.then(() => document.querySelector(`script[src="${u}"]`) ? null : new Promise((ok, bad) => {
    const s = document.createElement('script'); s.src = u; s.onload = ok; s.onerror = bad; document.head.appendChild(s);
  })), Promise.resolve());
}

function results() {
  const r = tally();
  const card = (p, name) => `<div class="score ${r[p].ok ? 'ok' : 'low'}"><div>${name}</div>
      <div class="big"><bdi dir="ltr">${r[p].c} / ${r[p].n}</bdi></div><div class="meta">${r[p].ok ? 'עברתם את הסף' : 'מתחת לסף'} (${r[p].need} תשובות נכונות)</div></div>`;
  const onlyWrong = st.onlyWrong === true;   // default: show all the questions
  const rev = Q.map((q, i) => {
    const a = st.ans[i], ok = a === q.k;
    if (onlyWrong && ok) return '';
    const tag = ok ? '<span class="tag ok">נכון</span>' : (a === DUNNO ? '<span class="tag dk">לא ידעתי</span>' : '<span class="tag bad">לא נכון</span>');
    const yours = a === DUNNO || a === null ? 'לא יודע/ת' : `${LETTERS[a]}. ${q.opts[a].h}`;
    return `<div class="rev">${blocks(q.pre)}<p><span class="qnum">${q.n}.</span> ${q.stem} ${tag}</p>${blocks(q.body)}
      <div class="ans">התשובה שלך: ${yours}</div>
      <div class="ans"><b>התשובה הנכונה: ${LETTERS[q.k]}. ${q.opts[q.k].h}</b></div>
      <div class="sol">${blocks(q.sol)}</div></div>`;
  }).join('');
  app.innerHTML = `
    <div class="logo"><img src="ou-logo.svg" alt="האוניברסיטה הפתוחה"></div>
    <h1>התוצאה שלך</h1>
    <div class="scores">${card(1, "חלק א' – מתמטיקה")}${card(2, "חלק ב' – פיסיקה")}</div>
    <div class="rec">${recText(r)}</div>
    <p class="meta">"לא יודע/ת" נחשבת כתשובה לא נכונה.</p>
    <p><button id="pdfbtn" class="btn primary" onclick="printSummary()">הורדת סיכום התוצאות (PDF)</button></p>
    <h2>הסברים</h2>
    <label class="toggle"><input type="checkbox" ${onlyWrong ? 'checked' : ''} onchange="st.onlyWrong=this.checked;render()"> הצג רק שאלות שלא עניתי עליהן נכון</label>
    ${rev || '<p>עניתם נכון על כל השאלות!</p>'}
    <div class="nav"><button class="btn ghost fbtn" onclick="toggleFormula()">דף נוסחאות</button>
      <button class="btn" onclick="restart()">להתחיל מחדש</button></div>`;
  math(app);
}
// back to the instructions page with all answers erased
function restart() { if (confirm('למחוק את כל התשובות ולחזור לעמוד ההוראות?')) { st = fresh(); render(); window.scrollTo(0, 0); } }

function formulaGrid(list) {
  // a bold label paragraph starts a cell; the equations after it go into the same cell
  const cells = [];
  list.forEach(b => { if (b.t !== "e" || !cells.length) cells.push([]); cells[cells.length - 1].push(b); });
  // two consecutive one-line cells (no displayed equation, e.g. Newton + gravity) share a cell
  for (let i = cells.length - 1; i > 0; i--)
    if (cells[i].length === 1 && cells[i - 1].length === 1 && i !== cells.length - 1 && cells[i - 1].length + cells[i].length <= 2
        && (i < 2 || cells[i - 2].length !== 1)) { cells[i - 1].push(...cells[i]); cells.splice(i, 1); }
  return "<div class=\"fgrid\">" + cells.map((c, i) => {
    const wide = (i === cells.length - 1 && cells.length % 2 === 1) ? " wide" : "";
    return "<div class=\"fcell" + wide + "\">" + blocks(c) + "</div>";
  }).join("") + "</div>";
}
function openFormula() {
  const fb = document.getElementById('fbody');
  if (!fb.dataset.done) { fb.innerHTML = formulaGrid(window.QUIZ.formula); math(fb); fb.dataset.done = '1'; }
  document.getElementById('fmodal').classList.add('open'); document.body.classList.add('fopen');
}
function toggleFormula() { document.body.classList.contains('fopen') ? closeFormula() : openFormula(); }
function closeFormula() { document.getElementById('fmodal').classList.remove('open'); document.body.classList.remove('fopen'); }

window.addEventListener('DOMContentLoaded', render);
</script>
